name: Feature request
description: Suggest a renderer-free, rules-respecting improvement.
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not require anti-bot evasion, CAPTCHA bypass, ban evasion, spam, or client impersonation.
          required: true
