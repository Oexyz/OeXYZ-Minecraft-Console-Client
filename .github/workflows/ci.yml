name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Set up Node for catalog verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Verify generated protocol catalog
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          npm run generate:protocol
          git diff --exit-code -- src/OeXYZ.Protocol/Resources/protocol-catalog.json src/OeXYZ.Protocol/Resources/en-us.json

      - name: Restore locked dependencies
        run: dotnet restore OeXYZ.ConsoleClient.slnx --locked-mode

      - name: Build with warnings as errors
        run: dotnet build OeXYZ.ConsoleClient.slnx -c Release --no-restore

      - name: Run deterministic protocol tests
        run: dotnet run --project tests/OeXYZ.Protocol.Tests -c Release --no-build

      - name: Run deterministic core tests
        run: dotnet run --project tests/OeXYZ.Core.Tests -c Release --no-build

      - name: Run deterministic updater and GUI behavior tests
        run: dotnet run --project tests/OeXYZ.ConsoleClient.Tests -c Release --no-build

      - name: Run deterministic session and redaction tests
        run: dotnet run --project tests/OeXYZ.Session.Tests -c Release --no-build

      - name: Run deterministic cross-platform authentication storage tests
        run: dotnet run --project tests/OeXYZ.Authentication.Tests -c Release --no-build

      - name: Run deterministic terminal dashboard tests
        run: dotnet run --project tests/OeXYZ.Cli.Tests -c Release --no-build

      - name: Write protocol compatibility report
        shell: pwsh
        run: |
          $catalog = Get-Content src/OeXYZ.Protocol/Resources/protocol-catalog.json -Raw | ConvertFrom-Json
          $required = @('keep_alive','kick_disconnect','position','update_health')
          $rows = foreach ($version in $catalog.versions) {
            $play = $version.packetIds.playClientbound
            $names = @($play.PSObject.Properties.Name)
            $missing = @($required | Where-Object { $_ -notin $names })
            [pscustomobject]@{ Minecraft=$version.minecraftVersion; Protocol=$version.protocolVersion; Missing=($missing -join ', ') }
          }
          $rows | Format-Table -AutoSize | Out-String | Tee-Object -FilePath protocol-compatibility.txt
          $knownRequests = @('UrlHash','UrlHashForcedPrompt','UuidUrlHashForcedPrompt')
          $knownResponses = @('HashAndStatus','StatusOnly','UuidAndStatus')
          foreach ($version in $catalog.versions) {
            if ($version.resourcePackRequestLayout -notin $knownRequests) {
              throw "Unknown resource-pack request layout for $($version.minecraftVersion): $($version.resourcePackRequestLayout)"
            }
            if ($version.resourcePackResponseLayout -notin $knownResponses) {
              throw "Unknown resource-pack response layout for $($version.minecraftVersion): $($version.resourcePackResponseLayout)"
            }
            $serverbound = @($version.packetIds.playServerbound.PSObject.Properties.Name) +
              @($version.packetIds.configurationServerbound.PSObject.Properties.Name)
            if ('resource_pack_receive' -notin $serverbound) {
              throw "Resource-pack response mapping missing for $($version.minecraftVersion)."
            }
          }
          if ($rows[-1].Missing) { throw "Newest protocol lacks critical mappings: $($rows[-1].Missing)" }
          $newest = $catalog.versions[-1].packetIds
          if ('ping' -notin @($newest.playClientbound.PSObject.Properties.Name) -or
              'pong' -notin @($newest.playServerbound.PSObject.Properties.Name)) {
            throw 'Newest protocol lacks the play ping/pong pair required by modern proxies.'
          }

      - name: Verify x64 and ARM64 self-contained single-file publishes
        shell: pwsh
        run: |
          foreach ($runtime in @('win-x64','win-arm64')) {
            $gui = "artifacts/$runtime/gui"
            $cli = "artifacts/$runtime/cli"
            dotnet publish src/OeXYZ.ConsoleClient/OeXYZ.ConsoleClient.csproj `
              -c Release -r $runtime --self-contained true `
              -p:RepositoryUrl="${{ github.server_url }}/${{ github.repository }}" -o $gui
            dotnet publish src/OeXYZ.Cli/OeXYZ.Cli.csproj `
              -c Release -r $runtime --self-contained true `
              -p:RepositoryUrl="${{ github.server_url }}/${{ github.repository }}" -o $cli
            if (-not (Test-Path "$gui/OeXYZ Console Client.exe") -or -not (Test-Path "$cli/oexyz.exe")) {
              throw "Single-file output missing for $runtime."
            }
            if (@(Get-ChildItem $gui -File).Count -ne 1 -or @(Get-ChildItem $cli -File).Count -ne 1) {
              throw "Publish for $runtime was not one executable per frontend."
            }
          }

      - name: Upload CI publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OeXYZ-Minecraft-Console-Client-windows-ci
          path: |
            artifacts/win-x64/
            artifacts/win-arm64/
            protocol-compatibility.txt
          if-no-files-found: error
          retention-days: 7

  linux-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker-container

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore Linux headless projects with locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            src/OeXYZ.Cli/OeXYZ.Cli.csproj
            tests/OeXYZ.Core.Tests/OeXYZ.Core.Tests.csproj
            tests/OeXYZ.Protocol.Tests/OeXYZ.Protocol.Tests.csproj
            tests/OeXYZ.Session.Tests/OeXYZ.Session.Tests.csproj
            tests/OeXYZ.Authentication.Tests/OeXYZ.Authentication.Tests.csproj
            tests/OeXYZ.Cli.Tests/OeXYZ.Cli.Tests.csproj
          )
          for project in "${projects[@]}"; do
            dotnet restore "$project" --locked-mode
          done

      - name: Validate the Linux installer
        shell: bash
        run: |
          set -euo pipefail
          sh -n install.sh
          sh install.sh --help >/dev/null
          shellcheck install.sh
          shellcheck tests/install-systemd.sh
          sh tests/install-systemd.sh

      - name: Build and run Linux deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/OeXYZ.Cli/OeXYZ.Cli.csproj -c Release --no-restore
          for project in \
            tests/OeXYZ.Core.Tests \
            tests/OeXYZ.Protocol.Tests \
            tests/OeXYZ.Session.Tests \
            tests/OeXYZ.Authentication.Tests; do
            dotnet run --project "$project" -c Release --no-restore
          done
          dotnet run --project tests/OeXYZ.Cli.Tests -c Release --no-restore

      - name: Publish and execute Linux x64 and ARM64 single-file CLIs
        shell: bash
        run: |
          set -euo pipefail
          for runtime in linux-x64 linux-arm64; do
            output="artifacts/$runtime"
            dotnet publish src/OeXYZ.Cli/OeXYZ.Cli.csproj \
              -c Release -r "$runtime" --self-contained true --no-restore \
              -p:RepositoryUrl="${{ github.server_url }}/${{ github.repository }}" -o "$output"
            test -x "$output/oexyz"
            test "$(find "$output" -maxdepth 1 -type f | wc -l)" -eq 1
          done
          artifacts/linux-x64/oexyz --help

      - name: Validate Compose and build the non-root multi-architecture container
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          test "$(docker compose config --images)" = \
            "ghcr.io/oexyz/oexyz-minecraft-console-client:latest"
          docker compose -f docker-compose.yml -f docker-compose.build.yml \
            config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml \
            config | grep -q 'dockerfile: Dockerfile'
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --output type=oci,dest=/tmp/oexyz-multiarch.oci \
            --build-arg VERSION=1.3.1-dev \
            --build-arg SOURCE_COMMIT="${{ github.sha }}" .

      - name: Upload Linux CI publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OeXYZ-Minecraft-Console-Client-linux-ci
          path: |
            artifacts/linux-x64/oexyz
            artifacts/linux-arm64/oexyz
            Dockerfile
            docker-compose.yml
            docker-compose.build.yml
            assets/systemd/oexyz.service
            install.sh
          if-no-files-found: error
          retention-days: 7
