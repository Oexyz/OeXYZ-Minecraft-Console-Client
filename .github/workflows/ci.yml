name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Set up Node for catalog verification
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify generated protocol catalog
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          npm run generate:protocol
          git diff --exit-code -- src/OeXYZ.Protocol/Resources/protocol-catalog.json

      - name: Restore locked dependencies
        run: dotnet restore OeXYZ.ConsoleClient.slnx --locked-mode

      - name: Build with warnings as errors
        run: dotnet build OeXYZ.ConsoleClient.slnx -c Release --no-restore

      - name: Run deterministic protocol tests
        run: dotnet run --project tests/OeXYZ.Protocol.Tests -c Release --no-build

      - name: Verify self-contained publish
        shell: pwsh
        run: |
          dotnet publish src/OeXYZ.ConsoleClient/OeXYZ.ConsoleClient.csproj `
            -c Release -r win-x64 --self-contained true --no-restore `
            -p:RepositoryUrl="${{ github.server_url }}/${{ github.repository }}" `
            -o artifacts/publish
          if (-not (Test-Path 'artifacts/publish/OeXYZ Console Client.exe')) {
            throw 'Published application executable was not produced.'
          }

      - name: Upload CI publish
        uses: actions/upload-artifact@v4
        with:
          name: OeXYZ-Console-Client-win-x64-ci
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 7
